[actor]
id = "billed-glm"
label = "Gardener (Synth GLM)"
enabled = true
role = "gardener"

[gardener]
id = "billed-glm"
label = "Gardener (Synth GLM)"
enabled = true

[prompt]
system_file = ".stack/gardeners/default.system.md"

[model]
provider = "synth_inference"
model = "glm-5.2"
reasoning_effort = "low"

[tools]
allow = ["gardener.inbox", "gardener.route", "gardener.steer", "gardener.queue", "gardener.garden_rewrite", "skills.register", "skills.suggest", "stack_status", "stack_runtime_status", "stack_list_remote_projects", "stack_list_live_smrs", "stack_list_factories", "stack_list_hosted_optimizer_runs", "stack_pull_artifact", "stack_inference_catalog", "stack_inference_usage", "stack_remote_gardener_handoff", "stack_ui_open_panel", "stack_ui_close_panel", "stack_meta_thread_create", "stack_worker_thread_create", "stack_meta_thread_update_goal", "stack_effort_templates", "stack_effort_list", "stack_effort_get", "stack_effort_remaining", "stack_effort_audit", "stack_effort_activity", "stack_effort_refresh_receipts", "stack_effort_create", "stack_effort_bind_thread", "stack_effort_update_progress", "stack_effort_record_blocker", "stack_effort_resolve_blocker", "stack_effort_record_acceptance", "stack_effort_record_idea", "stack_effort_record_note", "stack_effort_record_research_log", "stack_effort_record_repo", "stack_effort_record_finding", "stack_effort_record_capture", "stack_effort_record_benchmark", "stack_effort_record_optimizer_candidate", "stack_effort_record_run_evidence", "stack_effort_write_engineering_packet", "stack_effort_write_handoff", "stack_effort_update_refs", "stack_effort_update_status", "jsk.papercut", "handoff.force", "handoff.seal", "handoff.approve", "handoff.continue"]
deny = ["codex.interrupt"]

[permissions]
inbox = true
route = true
steer = true
queue = true
papercut_mirror = true
pause_worker = false
meta_thread_lifecycle = true
meta_thread_title = true

[wake]
on_turn_completed = true
idle_ms = 300000
on_inbox_pending = true
on_garden_dirty = true
